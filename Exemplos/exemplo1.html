<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizando CSS Interno na página</title>
    <!-- Css interno - SEMPRE FICAR NO HEAD DA PÁGINA! -->
     <style>
        /* Adicionando CSS a tag <p> */
            p {
                color: red;
                font-size: 23px;
            }

            h1{
                background-color: blue;
            }

            s {
                font-size: 50px;
            }
     </style>
</head>
<body>
    <p>CSS interno da página</p>
    <p>Teste</p>
    <h1>Não sei</h1>
    <s>Qualquer coisa</s>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS interno com classe e id</title>
    <style>

        * {
            background-color: aquamarine;
            margin: 0px;
            padding: 0px;
        }

        #paragrafo{
            font-size: 25px;
            background-color: red;
            color: white;
        }
        
        #informacoes{
            background-color: blue;
            font-size: 30px;
            text-align: center;
        }

        .titulo{
            background-color: aqua;
            text-align: right;
            font-weight: bold;
        }
        div a {
            color: red;

        }

        div p {
            color: blue;
        }

    </style>
</head>
<body>
    <p id="paragrafo">CSS  aplicado no id</p>
    <p id="informacoes">Informações complementares</p>

    <h3 class="titulo">Css aplicável na classe</h3>
    <p class="titulo">Informações com classe</p>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="titulo">Samuel</td>
                <td>23</td>
            </tr>
        </tbody>
    </table>
    <div>
        <a href="">Primeiro Link</a>
        <p>Qualquer coisa</p>
    </div>
</body>
</html>
